name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add missing final newlines
        run: node scripts/final-newlines.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      # npm publish silently rewrites or drops fields it considers invalid (it once dropped `bin`).
      - name: package.json needs no npm fixes
        run: cp package.json "$RUNNER_TEMP/package.json" && npm pkg fix && diff -u "$RUNNER_TEMP/package.json" package.json

  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # The end to end suite pipes the in process test server to the real sftp-server and scp.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client openssh-sftp-server
      - run: pnpm install --frozen-lockfile
      - run: pnpm coverage
      - if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage
          retention-days: 14

  docker:
    name: Real servers (OpenSSH, Dropbear, Toxiproxy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:docker

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:package
      - run: pnpm smoke
      # Node 20 is past end of life but still common on old CI images, keep it loading.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: node scripts/smoke.cjs && node scripts/smoke.mjs
