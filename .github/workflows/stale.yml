name: Close stale issues

on:
  schedule:
    - cron: '30 1 1,15 * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: >-
            This issue is stale because it has been open 180 days with no activity. Remove the
            stale label or comment, otherwise it will be closed in 30 days.
          stale-pr-message: >-
            This pull request is stale because it has been open 180 days with no activity. Remove
            the stale label or comment, otherwise it will be closed in 30 days.
          days-before-stale: 180
          days-before-close: 30
          exempt-issue-labels: pinned,security
